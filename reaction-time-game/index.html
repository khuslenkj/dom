<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reaction time</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>
  <body class="min-h-screen min-w-[1000px] bg-[#09090b] font-sans text-[#f4f4f5]">
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#d9f99d]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#d9f99d]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#d9f99d] transition-colors hover:border-[#d9f99d]/35 hover:bg-[#d9f99d]/10 hover:text-[#f4f4f5] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#d9f99d] motion-reduce:transition-none"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#d9f99d]/65">The everyday collection / 06</span>
      </header>

<div class="flex flex-1 items-center justify-center py-10">
      <div class="h-[575px] w-[576px] rounded-[24px] bg-[#18181B] border border-[#27272A] pl-[32px] pr-[30px] pt-[32px]">
        <div class="text-[24px] text-[#F4F4F5] font-[600] mb-[8px]">Reaction time</div>
        <div class="text-[14px] text-[#A1A1AA] font-[400] mb-[24px]">Wait for green, then click as quickly as you can.</div>
        <button id="main-button" class="h-[256px] w-[512px] rounded-[16px] bg-[#27272A] flex flex-col justify-center items-center gap-[12px] mb-[24px] cursor-pointer">
          <div><img src="Frame.svg" alt=""></div>
          <div class="text-[24px] text-[#F4F4F5] font-[600]">Ready when you are</div>
          <div class="text-[14px] text-[#F4F4F5] font-[400]">Click to start</div>
        </button>
        <button id="red-button" style="display: none;" class="h-[256px] w-[512px] rounded-[16px] bg-[#5E0808] flex flex-col justify-center items-center gap-[12px] mb-[24px] cursor-pointer">
          <div><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F4F4F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-ellipsis preview-icon"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></div>
          <div class="text-[24px] text-[#F4F4F5] font-[600]">Wait for green</div>
          <div class="text-[14px] text-[#F4F4F5] font-[400]">Not yet. Stay ready.</div>
        </button>
        <button id="green-button" style="display: none;" class="h-[256px] w-[512px] rounded-[16px] bg-[#5DE9BA] flex flex-col justify-center items-center gap-[12px] mb-[24px] cursor-pointer">
          <div><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-exclamation-point preview-icon"><rect width="18" height="18" x="3" y="3" rx="2"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg></div>
          <div class="text-[24px] text-[black] font-[600]">Click now!</div>
          <div class="text-[14px] text-[black] font-[400]">GO, go, go!</div>
        </button>
        <button id="result-button" style="display: none;" class="h-[256px] w-[512px] rounded-[16px] bg-[#27272A] flex flex-col justify-center items-center gap-[12px] mb-[24px] cursor-pointer">
          <div><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F4F4F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check preview-icon"><path d="M20 6 9 17l-5-5"/></svg></div>
          <div id="timer" class="text-[24px] text-[#F4F4F5] font-[600]">ms</div>
          <div class="text-[14px] text-[#F4F4F5] font-[400]">Click to play again</div>
        </button>
        <button id="toosoon-button" style="display: none;" class="h-[256px] w-[512px] rounded-[16px] bg-[#27272A] flex flex-col justify-center items-center gap-[12px] mb-[24px] cursor-pointer">
          <div><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F4F4F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-cw preview-icon"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></div>
          <div class="text-[24px] text-[#F4F4F5] font-[600]">Too soon!</div>
          <div class="text-[14px] text-[#F4F4F5] font-[400]">Click to try again</div>
        </button>
        <div class="grid grid-cols-2 gap-[12px] mb-[20px]">
          <div class="h-[84px] bg-[#27272A] rounded-[12px] flex flex-col justify-center items-center gap-[4px]">
            <div id="last" class="text-[24px] text-[#D9F99D] font-[400]">-</div>
            <div class="text-[12px] text-[#A1A1AA] font-[400]">Last attempt</div>
          </div>
          <div class="h-[84px] bg-[#27272A] rounded-[12px] flex flex-col justify-center items-center gap-[4px]">
            <div id="best" class="text-[24px] text-[#D9F99D] font-[400]">-</div>
            <div class="text-[12px] text-[#A1A1AA] font-[400]">Best this session</div>
          </div>
        </div>
        <div class="text-[12px] text-[#A1A1AA] font-[400] text-center">Click the panel, or focus it and press Space or Enter. Clicking before green ends the attempt.</div>
      </div>
      </div>
    </div>
  </body>
</html>
