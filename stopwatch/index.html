<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="min-h-screen min-w-[1000px] bg-[#101714] font-sans text-[#f0fdf4]">
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#c5d9bd]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#c5d9bd]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#c5d9bd] transition-colors hover:border-[#c5d9bd]/35 hover:bg-[#c5d9bd]/10 hover:text-[#f0fdf4] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#c5d9bd] motion-reduce:transition-none"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#c5d9bd]/65">The everyday collection / 04</span>
      </header>
      
<div class="flex flex-1 items-center justify-center py-10">
        <div class="w-[620px] h-[551px] bg-[#19231E8C] rounded-[28px] border border-[#FFFFFF26] p-[40px] pr-[38px]">
          <div class="w-[100%] h-[44px] flex justify-between mb-[28px]">
            <div class="size-[44px] bg-[#B5CBB21A] flex justify-center items-center rounded-[12px]">
              <img src="Frame.svg" alt="">
            </div>
            <div class="w-[62px] h-[29px] rounded-[99px] border border-[#C5D9BD26] flex justify-center items-center text-[12px] text-[#C5D9BD] font-500">Ready</div>
          </div>
          <div class="text-[40px] text-[#F0FDF4] font-[400] mb-[8px]">Stopwatch</div>
          <div class="text-[14px] text-[#A4B9AD] font-[400] mb-[36px]">Make time for what matters.</div>
          <div class="h-[158px] w-[100%] border-t border-b border-[#B5CBB226] flex items-center justify-around">
            <div class="flex flex-col items-center gap-[16px]">
              <div class="text-[56px] text-[#EDF3E8] font-[300] leading-[56px] tracking-[-2px]">00</div>
              <div class="text-[9px] text-[#9BAD9E] font-500 tracking-[2px]">HOURS</div>
            </div>
            <div class="text-[40px] text-[#5C7161] font-[400] mb-[35px]">:</div>
            <div class="flex flex-col items-center gap-[16px]">
              <div class="text-[56px] text-[#EDF3E8] font-[300] leading-[56px] tracking-[-2px]">00</div>
              <div class="text-[9px] text-[#9BAD9E] font-500 tracking-[2px]">MINUTES</div>
            </div>
            <div class="text-[40px] text-[#5C7161] font-[400] mb-[35px]">:</div>
            <div class="flex flex-col items-center gap-[16px]">
              <div class="text-[56px] text-[#EDF3E8] font-[300] leading-[56px] tracking-[-2px]">00</div>
              <div class="text-[9px] text-[#9BAD9E] font-500 tracking-[2px]">SECONDS</div>
            </div>
          </div>
          <div class="flex gap-[12px] mt-[32px]">
            <button class="w-[258px] h-[48px] bg-[#B5CBB2] rounded-[12px] text-[14px] text-[#102418] font-[600] cursor-pointer">Start</button>
            <button class="w-[129px] h-[48px] bg-[#FFFFFF0D] rounded-[12px] border border-[#FFFFFF1A] text-[14px] text-[#DCECE2] font-500 opacity-[35%] cursor-pointer">Pause</button>
            <button class="w-[129px] h-[48px] bg-[#FFFFFF0D] rounded-[12px] border border-[#FFFFFF1A] text-[14px] text-[#DCECE2] font-500 opacity-[35%] cursor-pointer">Reset</button>
          </div>
          <div class="mt-[20px] justify-self-center text-[12px] text-[#8AA294] font-400">A moment of focus. At your own pace.</div>
        </div>
      </div>
    </div>
  </body>
</html>
